name: CD - Trigger Infra Deploy (Core Services)

on:
  push:
    branches:
      - deploy
    paths:
      - 'identity-service/**'
      - 'fleet-service/**'
      - 'wallet-service/**'
      - 'contract-service/**'
      - 'media-service/**'
      - 'Dockerfile'
      - 'docker-entrypoint.sh'
      - 'pom.xml'

permissions:
  contents: read

jobs:
  dispatch-deploy:
    name: Dispatch Changed Core Services
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed modules & dispatch deploy to backhaulbid-infrastructure
        env:
          INFRA_DISPATCH_TOKEN: ${{ secrets.INFRA_DISPATCH_TOKEN }}
          EVENT_BEFORE: ${{ github.event.before || '' }}
          EVENT_SHA: ${{ github.sha }}
          REPO_NAME: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [[ -z "${INFRA_DISPATCH_TOKEN}" ]]; then
            echo "::error::Missing secret INFRA_DISPATCH_TOKEN (Fine-grained PAT with Contents: Read and write on Phucvinh0411/backhaulbid-infrastructure)."
            exit 1
          fi

          ALL_CORE="identity-service,fleet-service,wallet-service,contract-service,media-service"
          SERVICES=""

          if [[ -z "${EVENT_BEFORE}" || "${EVENT_BEFORE}" == "0000000000000000000000000000000000000000" ]] \
            || ! git cat-file -e "${EVENT_BEFORE}^{commit}" 2>/dev/null; then
            SERVICES="${ALL_CORE}"
          else
            CHANGED="$(git diff --name-only "${EVENT_BEFORE}" "${EVENT_SHA}")"
            if printf '%s\n' "${CHANGED}" | grep -qE '^(pom\.xml|Dockerfile|docker-entrypoint\.sh)$'; then
              SERVICES="${ALL_CORE}"
            else
              for svc in identity-service fleet-service wallet-service contract-service media-service; do
                if printf '%s\n' "${CHANGED}" | grep -q "^${svc}/"; then
                  SERVICES="${SERVICES:+${SERVICES},}${svc}"
                fi
              done
            fi
          fi

          if [[ -z "${SERVICES}" ]]; then
            echo "No Core service artifacts changed; skipping deploy dispatch."
            exit 0
          fi

          SHORT_SHA="$(git rev-parse --short HEAD)"
          echo "Dispatching services=${SERVICES}, image_tag=${SHORT_SHA}, source_branch=deploy"

          curl -sS --fail-with-body -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${INFRA_DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Phucvinh0411/backhaulbid-infrastructure/dispatches \
            -d "{\"event_type\":\"deploy-services\",\"client_payload\":{\"services\":\"${SERVICES}\",\"image_tag\":\"${SHORT_SHA}\",\"source_branch\":\"deploy\",\"triggered_by\":\"${REPO_NAME}@${SHORT_SHA}\"}}"
