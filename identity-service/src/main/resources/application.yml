server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: identity-service
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  # ──────────────────────────────────────────
  # DataSource Configuration
  # ──────────────────────────────────────────
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/backhaulbid_identity}
    username: ${DB_USERNAME:backhaulbid}
    password: ${DB_PASSWORD:backhaulbid_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 20000

  # ──────────────────────────────────────────
  # JPA Configuration
  # ──────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # ──────────────────────────────────────────
  # Flyway Configuration
  # ──────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  business-verification:
    upload-dir: ${BUSINESS_VERIFICATION_UPLOAD_DIR:./data/business-verifications}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
    path: /swagger-ui.html
    disable-swagger-default-url: true
