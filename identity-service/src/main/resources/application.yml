server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: identity-service
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 16MB
      file-size-threshold: 16MB

  # ──────────────────────────────────────────
  # Docker and CI must supply these values; keeping them required prevents accidental database drift.
  # ──────────────────────────────────────────
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      idle-timeout: 30000
      connection-timeout: 20000

  # ──────────────────────────────────────────
  # JPA Configuration
  # ──────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate
    # Keep SQL logging off by default to avoid Hikari pool/I/O contention in multi-pod clusters.
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${SPRING_JPA_SHOW_SQL:false}
        default_batch_fetch_size: 50
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # ──────────────────────────────────────────
  # Flyway Configuration
  # ──────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: false

  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    register-with-eureka: ${EUREKA_ENABLED:true}
    fetch-registry: ${EUREKA_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

app:
  ekyc:
    nfc-enabled: ${NFC_EKYC_ENABLED:false}
    evidence-key: ${EKYC_EVIDENCE_ENCRYPTION_KEY:}
    auto-accept: ${EKYC_AUTO_ACCEPT:DISABLED}
    # Literal on purpose (no env var): only the local profile file turns this on.
    development-pass-accepted: false
  jwt:
    secret: ${JWT_SECRET}
  # Driver code sign-in (V3.1): contract owns assignments; the replay key never leaves the backend.
  contract:
    url: ${CONTRACT_SERVICE_URL:http://contract-service:8080}
  # Cargo-liability certificates are private: identity reads them from media-service over the internal token only.
  media:
    url: ${MEDIA_SERVICE_URL:http://media-service:8080}
  internal-token: ${INTERNAL_SERVICE_TOKEN:}
  # Company lookup by tax code (xinvoice.vn). Both values are sent as headers and are never logged.
  business-lookup:
    client-id: ${BUSINESS_LOOKUP_CLIENT_ID:}
    api-key: ${BUSINESS_LOOKUP_API_KEY:}
  driver:
    replay-key: ${DRIVER_REPLAY_KEY:}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  mail:
    enabled: ${IDENTITY_EMAIL_OTP_ENABLED:true}
    from: ${MAIL_FROM:no-reply@backhaulbid.vn}
    from-name: ${MAIL_FROM_NAME:BackhaulBid}
    otp-ttl-seconds: ${IDENTITY_EMAIL_OTP_TTL_SECONDS:600}
    otp-resend-cooldown-seconds: ${IDENTITY_EMAIL_OTP_RESEND_COOLDOWN_SECONDS:60}
    otp-max-attempts: ${IDENTITY_EMAIL_OTP_MAX_ATTEMPTS:5}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
    path: /swagger-ui.html
    disable-swagger-default-url: true
