server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: wallet-service

  # ──────────────────────────────────────────
  # Docker Compose and CI must supply datasource settings for production-like runs.
  # Tests override these values with the embedded H2 profile.
  # ──────────────────────────────────────────
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 20000

  # ──────────────────────────────────────────
  # Hibernate validates the Flyway-managed schema instead of creating tables implicitly.
  # ──────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # ──────────────────────────────────────────
  # Flyway Configuration
  # ──────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
    path: /swagger-ui.html
    disable-swagger-default-url: true

# Provider settings are disabled by default so local Docker boots without
# credentials. Enable the Sandbox only after supplying merchant credentials.
sepay:
  enabled: ${SEPAY_ENABLED:false}
  merchant-id: ${SEPAY_MERCHANT_ID:}
  secret-key: ${SEPAY_SECRET_KEY:}
  ipn-secret: ${SEPAY_IPN_SECRET:${SEPAY_SECRET_KEY:}}
  checkout-url: ${SEPAY_CHECKOUT_URL:https://pay-sandbox.sepay.vn/v1/checkout/init}
  success-url: ${SEPAY_SUCCESS_URL:http://localhost:3002/carrier/wallet?payment=success}
  error-url: ${SEPAY_ERROR_URL:http://localhost:3002/carrier/wallet?payment=error}
  cancel-url: ${SEPAY_CANCEL_URL:http://localhost:3002/carrier/wallet?payment=cancel}
